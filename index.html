<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="48x48" href="/logo-icon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/logo-icon.png" />
  <link rel="apple-touch-icon" href="/logo-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NorthStarDevs — Custom Websites & Web Applications in Sri Lanka</title>
  <meta name="description"
    content="NorthStarDevs builds high-performance custom websites, web applications, and digital experiences for Sri Lankan businesses and global clients." />
  <link rel="canonical" href="https://northstardevs.com/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- OpenGraph -->
  <meta property="og:site_name" content="NorthStarDevs" />
  <meta property="og:title" content="NorthStarDevs — Custom Websites & Web Applications" />
  <meta property="og:description"
    content="NorthStarDevs builds high-performance custom websites, web applications, and digital experiences for Sri Lankan businesses and global clients." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://northstardevs.com/" />
  <meta property="og:image" content="https://northstardevs.com/logo-icon.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NorthStarDevs — Custom Websites & Web Applications" />
  <meta name="twitter:description"
    content="NorthStarDevs builds high-performance custom websites, web applications, and digital experiences." />

  <!-- Structured Data JSON-LD for Google Site Name & Organization Ranking -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://northstardevs.com/#website",
        "url": "https://northstardevs.com/",
        "name": "NorthStarDevs",
        "alternateName": ["North Star Devs", "NorthStar Developers"],
        "description": "Custom Websites & Web Applications Development Agency"
      },
      {
        "@type": "Organization",
        "@id": "https://northstardevs.com/#organization",
        "name": "NorthStarDevs",
        "alternateName": "North Star Devs",
        "url": "https://northstardevs.com/",
        "logo": "https://northstardevs.com/logo-icon.png",
        "sameAs": [
          "https://www.instagram.com/northstardevs/",
          "https://github.com/northstardevs"
        ]
      }
    ]
  }
  </script>

  <!-- Google Fonts: Montserrat (Display), Poppins (Body), JetBrains Mono (Labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
